<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>电商客服 Agent 控制台</title>
  <style>
    :root { --bg:#f5f7fb; --card:#fff; --text:#172033; --muted:#6b7280; --line:#e5e7eb; --primary:#2563eb; --danger:#dc2626; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--text); background:var(--bg); font:14px/1.6 system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif; }
    header { padding:24px 32px; background:#111827; color:#fff; }
    header h1 { margin:0 0 4px; font-size:24px; } header p { margin:0; color:#cbd5e1; }
    main { max-width:1180px; margin:24px auto; padding:0 20px; display:grid; gap:18px; }
    .grid { display:grid; grid-template-columns:minmax(0,1.35fr) minmax(320px,.65fr); gap:18px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; box-shadow:0 3px 12px #1118270a; }
    h2 { margin:0 0 14px; font-size:18px; } h3 { margin:14px 0 8px; font-size:15px; }
    label { display:block; margin:8px 0 4px; color:var(--muted); font-size:12px; }
    input, textarea { width:100%; border:1px solid #d1d5db; border-radius:8px; padding:9px 10px; background:#fff; color:var(--text); }
    textarea { min-height:90px; resize:vertical; }
    button { border:0; border-radius:8px; padding:8px 12px; cursor:pointer; background:var(--primary); color:#fff; font-weight:600; }
    button.secondary { background:#eef2ff; color:#1d4ed8; } button.danger { background:#fee2e2; color:#b91c1c; }
    button:disabled { opacity:.55; cursor:not-allowed; }
    .row { display:flex; gap:9px; align-items:center; } .row > * { flex:1; } .row button { flex:0 0 auto; }
    .messages { height:430px; overflow:auto; padding:10px; border:1px solid var(--line); border-radius:10px; background:#fafafa; }
    .msg { margin:9px 0; padding:9px 11px; border-radius:10px; white-space:pre-wrap; } .msg.user { background:#dbeafe; margin-left:18%; } .msg.assistant { background:#fff; border:1px solid var(--line); margin-right:10%; }
    .meta { color:var(--muted); font-size:12px; margin-top:5px; } .citation { color:#1d4ed8; font-size:12px; margin-top:5px; }
    .status { padding:8px 10px; border-radius:8px; background:#f1f5f9; color:#475569; margin:8px 0; }
    .small { color:var(--muted); font-size:12px; }
    @media (max-width:900px) { .grid { grid-template-columns:1fr; } header { padding:20px; } }
  </style>
</head>
<body>
  <header><h1>电商客服 Agent 控制台</h1><p>本地调试界面：对话、引用证据、会话状态与重置</p></header>
  <main>
    <div class="grid">
      <section class="card">
        <h2>智能问答</h2>
        <div id="messages" class="messages"><div class="small">试试：退货政策是什么？ 或 我的订单还没发货，怎么回事？</div></div>
        <div class="row" style="margin-top:10px"><textarea id="question" rows="2" placeholder="输入问题，Enter 发送，Shift+Enter 换行"></textarea><button id="send">发送</button></div>
      </section>

      <section class="card">
        <h2>会话</h2>
        <label>thread_id</label><input id="thread" value="demo-thread" />
        <div class="row" style="margin-top:10px"><button class="secondary" id="refreshState">查看状态</button><button class="danger" id="reset">重置会话</button></div>
        <div id="sessionState" class="status">等待操作</div>
        <p class="small">敏感操作（如退款）会先暂停等待确认：回复「确认」执行，「取消」取消，「重新说明」重新规划。</p>
      </section>
    </div>
  </main>
  <script>
    const $ = id => document.getElementById(id);
    const json = async (url, options={}) => { const r = await fetch(url, options); const data = await r.json(); if (!r.ok) throw new Error(data.error || `HTTP ${r.status}`); return data; };
    const addMessage = (kind, text, citations=[], meta='') => {
      const box=$('messages'); const el=document.createElement('div'); el.className=`msg ${kind}`;
      el.textContent=text;
      if (citations.length) { const c=document.createElement('div'); c.className='citation'; c.textContent='引用：'+citations.map(x=>`${x.title||x.source} / ${x.section||''}`).join('；'); el.appendChild(c); }
      if (meta) { const m=document.createElement('div'); m.className='meta'; m.textContent=meta; el.appendChild(m); }
      box.appendChild(el); box.scrollTop=box.scrollHeight;
    };
    $('send').onclick = async () => {
      const q=$('question').value.trim(); if(!q)return;
      $('question').value=''; addMessage('user',q); $('send').disabled=true;
      try {
        const d=await json('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user_input:q,thread_id:$('thread').value.trim()})});
        addMessage('assistant',d.reply||'无回复',d.citations||[],`意图 ${d.intent||'-'} · 置信度 ${d.confidence ?? '-'} · 转人工 ${d.requires_human ? '是' : '否'}`);
      } catch(e){ addMessage('assistant','请求失败：'+e.message); } finally {$('send').disabled=false;}
    };
    $('question').addEventListener('keydown', e => { if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('send').click();} });
    $('refreshState').onclick = async () => {
      const tid=$('thread').value.trim(); if(!tid){$('sessionState').textContent='请先填写 thread_id';return;}
      try { const d=await json('/chat/'+encodeURIComponent(tid)+'/state'); $('sessionState').textContent = `thread ${d.thread_id}：等待人工确认 ${d.interrupted ? '是' : '否'}，已有 checkpoint ${d.has_checkpoint ? '是' : '否'}`; }
      catch(e){ $('sessionState').textContent='查询失败：'+e.message; }
    };
    $('reset').onclick = async () => {
      const tid=$('thread').value.trim(); if(!tid){$('sessionState').textContent='请先填写 thread_id';return;}
      try { await json('/chat/'+encodeURIComponent(tid)+'/reset',{method:'POST'}); $('sessionState').textContent=`已重置 thread ${tid} 的会话与 checkpoint`; }
      catch(e){ $('sessionState').textContent='重置失败：'+e.message; }
    };
  </script>
</body>
</html>
